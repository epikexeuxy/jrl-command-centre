name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jrl
          POSTGRES_PASSWORD: jrl
          POSTGRES_DB: jrl_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jrl"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system deps (WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b fonts-dejavu-core
      - name: Install python deps
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Migrations apply cleanly on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://jrl:jrl@localhost:5432/jrl_test
          SECRET_KEY: ci-secret
        run: alembic upgrade head
      - name: Tests
        env:
          SECRET_KEY: ci-secret
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
